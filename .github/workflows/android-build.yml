name: POS Ledger NG Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android-build

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "cmdline-tools;latest"
          yes | sdkmanager --licenses || true

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython==0.29.36"

      - name: Prepare Buildozer Android SDK
        run: |
          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "BUILD_SDK=$BUILD_SDK"

          rm -rf "$BUILD_SDK"
          mkdir -p "$BUILD_SDK"

          echo "Copying Android SDK..."

          cp -a "$ANDROID_HOME/platform-tools" "$BUILD_SDK/"
          cp -a "$ANDROID_HOME/build-tools" "$BUILD_SDK/"
          cp -a "$ANDROID_HOME/platforms" "$BUILD_SDK/"
          cp -a "$ANDROID_HOME/cmdline-tools" "$BUILD_SDK/"
          cp -a "$ANDROID_HOME/licenses" "$BUILD_SDK/"

          echo "Installing SDK manager compatibility path..."

          mkdir -p "$BUILD_SDK/tools/bin"

          ln -sf \
            "$BUILD_SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$BUILD_SDK/tools/bin/sdkmanager"

          echo "=== Buildozer SDK ==="
          ls -lah "$BUILD_SDK"

          echo "=== Build tools ==="
          ls -lah "$BUILD_SDK/build-tools"

          echo "=== AIDL ==="
          find "$BUILD_SDK/build-tools" \
            -name aidl \
            -type f \
            -print

          echo "=== SDK manager ==="
          "$BUILD_SDK/tools/bin/sdkmanager" --version || true

      - name: Prepare Android NDK
        run: |
          echo "Available NDKs:"
          ls -lah "$ANDROID_HOME/ndk" || true

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"

      - name: Verify Android build environment
        run: |
          BUILD_SDK="$HOME/.buildozer/android/platform/android-sdk"

          test -d "$BUILD_SDK/build-tools/34.0.0"
          test -f "$BUILD_SDK/build-tools/34.0.0/aidl"
          test -f "$BUILD_SDK/platforms/android-34/android.jar"

          echo "AIDL:"
          "$BUILD_SDK/build-tools/34.0.0/aidl" --version || true

          echo "SDK:"
          ls -lah "$BUILD_SDK"

          echo "Platform:"
          ls -lah "$BUILD_SDK/platforms/android-34"

          echo "Build tools:"
          ls -lah "$BUILD_SDK/build-tools/34.0.0"

      - name: Build debug APK
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          buildozer -v android debug

      - name: List APK
        run: |
          echo "=== APK OUTPUT ==="
          ls -lah bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POS-Ledger-NG-debug
          path: bin/*.apk
          if-no-files-found: error
