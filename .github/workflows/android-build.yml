name: POS Ledger NG Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android-build

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython==0.29.36"

      - name: Show build environment
        run: |
          echo "Architecture:"
          uname -m

          echo "Python:"
          python --version

          echo "Buildozer:"
          buildozer --version

          echo "Java:"
          java -version

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Android SDK packages:"
          sdkmanager --list_installed | grep -E \
            'platform-tools|platforms;android-34|build-tools;34.0.0' || true

      - name: Configure Buildozer Android SDK
        run: |
          mkdir -p "$HOME/.buildozer/android/platform"
          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

          ln -s "$ANDROID_HOME" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "Buildozer SDK:"
          ls -lah "$HOME/.buildozer/android/platform/android-sdk"

          echo "Build tools:"
          ls -lah "$HOME/.buildozer/android/platform/android-sdk/build-tools"

          echo "AIDL:"
          find "$HOME/.buildozer/android/platform/android-sdk/build-tools" \
            -name aidl -type f -print

      - name: Build debug APK
        run: |
          buildozer -v android debug

      - name: List APK
        run: |
          ls -lah bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POS-Ledger-NG-debug
          path: bin/*.apk
          if-no-files-found: error
