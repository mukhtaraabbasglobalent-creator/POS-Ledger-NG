name: POS Ledger NG Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android-build

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358"

      - name: Verify Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "=== Installed SDK packages ==="
          sdkmanager --list_installed

          echo "=== AIDL ==="
          "$ANDROID_HOME/build-tools/34.0.0/aidl" --version

          echo "=== NDK ==="
          test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties"
          cat "$ANDROID_HOME/ndk/28.2.13676358/source.properties"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython==0.29.36"

      - name: Clean old Buildozer Android platform
        run: |
          rm -rf .buildozer/android/platform/android-sdk
          rm -rf .buildozer/android/platform/android-ndk*

      - name: Build debug APK
        run: |
          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROIDNDK="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROIDAPI="34"
          export NDKAPI="24"
          export ANDROIDNDKVER="r28c"

          buildozer -v android debug

      - name: List APK
        run: |
          echo "=== APK OUTPUT ==="
          find bin -maxdepth 1 -type f -name "*.apk" -print -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POS-Ledger-NG-debug
          path: bin/*.apk
          if-no-files-found: error
